name: WheelForge database tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pgtap:
    name: Run Supabase pgTAP policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Run database tests
        shell: bash
        run: |
          set +e
          supabase test db 2>&1 | tee supabase-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              if [[ "$line" =~ (not\ ok|ERROR|error|failed|FATAL) ]]; then
                echo "::error title=Supabase pgTAP::$line"
              fi
            done < supabase-test.log
          fi
          exit "$status"

      - name: Upload database test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-test-log
          path: supabase-test.log
          if-no-files-found: ignore
          retention-days: 14
