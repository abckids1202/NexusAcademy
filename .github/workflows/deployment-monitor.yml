name: WheelForge deployment monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Optional deployed origin override, including https://"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: wheelforge-deployment-monitor
  cancel-in-progress: true

jobs:
  smoke-check:
    name: Check deployed WheelForge origin
    if: ${{ vars.DEPLOYMENT_URL != '' || inputs.deployment_url != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployed routes, headers, and health endpoint
        env:
          DEPLOYMENT_URL: ${{ inputs.deployment_url || vars.DEPLOYMENT_URL }}
          NODE_ENV: production
        run: npm run verify:deployment

